<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="CORTE — Tracker de transformación física. 80 días. Sin excusas.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CORTE">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">

  <title>CORTE</title>
</head>
<body>
  <div id="app">
    <div id="view"></div>
    <div id="nav"></div>
  </div>

  <!-- Frase del día – Modal pantalla completa -->
  <div id="quote-modal" class="hidden">
    <div class="quote-modal-inner">
      <div class="quote-modal-label">Frase del día</div>
      <div id="quote-text" class="quote-modal-text"></div>
      <button class="btn-primary quote-accept-btn" onclick="acceptQuote()">ACEPTO</button>
    </div>
  </div>

  <!-- PWA Install Banner -->
  <div id="install-banner" class="hidden">
    <span>Instala CORTE en tu celular</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="install-btn" onclick="installApp()">Instalar</button>
      <button id="install-dismiss" onclick="dismissInstall()">✕</button>
    </div>
  </div>

  <script src="./quotes.js"></script>
  <script src="./app.js"></script>
</body>
</html>
